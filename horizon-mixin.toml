# Pinned: a line typed in chat, before it is sent. `#goto ...` is Baritone's and goes no further.
[[injection]]
id = "chat"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::chat::Game<'_>::handle_chat_input"
helper = "hooks/chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "hooks/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "hooks/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "hooks/list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "hooks/settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "hooks/click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Pinned: `camera_relative` turns a list of lines into what the GPU draws. The game calls it for the
# depth-tested lines, then the lines over everything, then the crosshair: on the second call Baritone
# converts the game's lines and its own together.
[[injection]]
id = "lines"
kind = "HEAD"
cancellable = true
target = "horizon_client::gizmos::camera_relative"
helper = "hooks/lines.rs"
bindings = [
  { name = "lines", ty = "&[crate::gizmos::Line]", value = "lines" },
  { name = "camera", ty = "[f64; 3]", value = "camera" },
  { name = "view", ty = "glam::Mat4", value = "view" },
]

# The game reads the movement keys only on the playing screen; Baritone keeps walking with the chat open,
# as the Java one does. Just before the motion reads the keys the chat counts as the playing screen, and
# once they are read it is the chat again (and at the start of the tick, if the tick ended early).
[[injection]]
id = "keys_before"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::sync_player_body"
helper = "hooks/keys_before.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "keys_after"
kind = "HEAD"
target = "horizon_client::game::fov::Game<'_>::tick_avatar"
helper = "hooks/keys_after.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "keys_tick"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::tick"
helper = "hooks/keys_tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "keys_remote"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
helper = "hooks/keys_remote.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

